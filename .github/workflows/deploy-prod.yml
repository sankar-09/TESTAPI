name: Deploy to AWS

on:
  push:
    branches:
      - "Prod"

env:
  AWS_REGION: eu-north-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
  SERVER_PUBLIC_IP: ${{ secrets.AWS_PUBLIC_IP }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aws-deploy
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          echo "Pushing Docker image..."
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy Docker Image to EC2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aws-deploy
          IMAGE_TAG: ${{ github.sha }}
          AWS_DEFAULT_REGION: eu-north-1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_PUBLIC_IP }}
          username: ubuntu   # Change this if your target instance uses a different username (e.g. Administrator for Windows)
          key: ${{ env.PRIVATE_SSH_KEY }}
          shell: pwsh
          script: |
            # Authenticate Docker to ECR using AWS Tools for PowerShell
            (Get-ECRLoginCommand).Password | docker login --username AWS --password-stdin 166799231300.dkr.ecr.eu-north-1.amazonaws.com
            
            # Stop and remove any existing container (errors are suppressed)
            docker stop myappcontainer -ErrorAction SilentlyContinue
            docker rm myappcontainer -ErrorAction SilentlyContinue
            
            # Pull and run the newly pushed Docker image
            docker pull $REGISTRY/$REPOSITORY:$IMAGE_TAG
            docker run -d --name myappcontainer -p 3000:3000 $REGISTRY/$REPOSITORY:$IMAGE_TAG
