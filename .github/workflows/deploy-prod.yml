name: Deploy to AWS

on:
  push:
    branches:
      - "Prod"

env:
  AWS_REGION: eu-north-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
  SERVER_PUBLIC_IP: ${{ secrets.AWS_PUBLIC_IP }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        # Note: This step outputs no variables we need; the registry is defined manually.

      - name: Build and Push Docker Image
        env:
          # Manually set the registry and repository.
          REGISTRY: 166799231300.dkr.ecr.eu-north-1.amazonaws.com
          REPOSITORY: aws-deploy
        run: |
          echo "Building Docker image..."
          docker build -t aws-deploy .
          echo "Tagging Docker image..."
          docker tag aws-deploy:latest $REGISTRY/$REPOSITORY:latest
          echo "Pushing Docker image..."
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy Docker Image to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_PUBLIC_IP }}
          username: ec2-user
          key: ${{ env.PRIVATE_SSH_KEY }}
          script: |
            # Define the ECR registry and image details.
            REGISTRY="166799231300.dkr.ecr.eu-north-1.amazonaws.com"
            REPOSITORY="aws-deploy"
            IMAGE_TAG="latest"

            echo "Registry: ${REGISTRY}"
            echo "Repository: ${REPOSITORY}"
            echo "Image Tag: ${IMAGE_TAG}"

            # Update packages and install Docker and AWS CLI using yum.
            sudo yum update -y
            sudo yum install -y docker aws-cli

            # Start Docker using systemctl.
            sudo systemctl start docker

            # Authenticate Docker to your registry using the AWS CLI.
            aws ecr get-login-password --region eu-north-1 | sudo docker login --username AWS --password-stdin ${REGISTRY}

            # Clean up any previously running container.
            sudo docker stop myappcontainer || true
            sudo docker rm myappcontainer || true

            # Create an env file with the required ACCESS_TOKEN_KEY.
            echo "ACCESS_TOKEN_KEY=${{ secrets.ACCESS_TOKEN_KEY }}" > $(pwd)/TESTAPI.env

            # Pull the latest Docker image.
            sudo docker pull ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
            
            # Run the container using the env file.
            sudo docker run -d --name myappcontainer --env-file $(pwd)/TESTAPI.env -p 3000:3000 ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
