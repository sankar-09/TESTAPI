name: Deploy to AWS

on:
  push:
    branches:
      - "Prod"

env:
  AWS_REGION: eu-north-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
  SERVER_PUBLIC_IP: ${{ secrets.AWS_PUBLIC_IP }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        # (This step doesn’t output variables we need, so we set the registry manually.)

      - name: Build and Push Docker Image
        env:
          # Populate the registry manually as the output might be empty.
          REGISTRY: 166799231300.dkr.ecr.eu-north-1.amazonaws.com
          REPOSITORY: aws-deploy
        run: |
          echo "Building Docker image..."
          docker build -t aws-deploy .
          echo "Tagging Docker image..."
          docker tag aws-deploy:latest $REGISTRY/$REPOSITORY:latest
          echo "Pushing Docker image..."
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy Docker Image to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_PUBLIC_IP }}
          username: ec2-user
          key: ${{ env.PRIVATE_SSH_KEY }}
          # We omit the envs input here because we are defining the credentials explicitly within the script.
          script: |
            # Directly set and export the AWS credentials by interpolating GitHub secrets.
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY }}"
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            AWS_REGION="${{ env.AWS_REGION }}"
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION
            
            # Define explicit variables for the ECR registry and image details.
            REGISTRY="166799231300.dkr.ecr.eu-north-1.amazonaws.com"
            REPOSITORY="aws-deploy"
            IMAGE_TAG="latest"

            echo "Registry: ${REGISTRY}"
            echo "Repository: ${REPOSITORY}"
            echo "Image Tag: ${IMAGE_TAG}"

            # Check that AWS credentials are set (values themselves will be masked)
            if [ -z "$AWS_ACCESS_KEY_ID" ]; then
              echo "AWS_ACCESS_KEY_ID is NOT set"
            else
              echo "AWS_ACCESS_KEY_ID is set"
            fi

            # Update packages and install Docker and AWS CLI using yum
            sudo yum update -y
            sudo yum install -y docker aws-cli

            # Start Docker using systemctl
            sudo systemctl start docker

            # Authenticate Docker to your registry using the AWS CLI (region hardcoded)
            aws ecr get-login-password --region eu-north-1 | sudo docker login --username AWS --password-stdin ${REGISTRY}

            # Clean up any previously running container
            sudo docker stop myappcontainer || true
            sudo docker rm myappcontainer || true

            # Pull the latest Docker image and run it
            sudo docker pull ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
            sudo docker run -d --name myappcontainer -p 3000:3000 ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
