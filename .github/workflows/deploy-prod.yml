name: Deploy to AWS

on:
  push:
    branches:
      - "Production" # With Redis
  schedule:
    - cron: "0 3 * * 0"  # Run every Sunday at 03:00 UTC (adjust as needed)

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
  SERVER_PUBLIC_IP: ${{ secrets.AWS_PUBLIC_IP }}
  DOTENV: ${{ secrets.DOTENV }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v3

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          REGISTRY: 166799231300.dkr.ecr.eu-north-1.amazonaws.com
          REPOSITORY: aws-deploy
        run: |
          echo "Building Docker image..."
          docker build -t aws-deploy .
          echo "Tagging Docker image..."
          docker tag aws-deploy:latest $REGISTRY/$REPOSITORY:latest
          echo "Pushing Docker image..."
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy Container on EC2 (Setup System & Run API)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_PUBLIC_IP }}
          username: ec2-user
          key: ${{ env.PRIVATE_SSH_KEY }}
          script: |
            # Define ECR registry and image details.
            REGISTRY="166799231300.dkr.ecr.eu-north-1.amazonaws.com"
            REPOSITORY="aws-deploy"
            IMAGE_TAG="latest"

            echo "Registry: ${REGISTRY}"
            echo "Repository: ${REPOSITORY}"
            echo "Image Tag: ${IMAGE_TAG}"

            # Update system packages & Install required dependencies
            echo "Updating system packages..."
            sudo yum update -y
            echo "Installing Docker, AWS CLI, and Redis..."
            sudo yum install -y docker aws-cli redis

            # Start & Enable Docker Service
            echo "Starting Docker service..."
            sudo systemctl start docker
            sudo systemctl enable docker

            # Start & Enable Redis Service
            echo "Starting Redis service..."
            sudo systemctl start redis
            sudo systemctl enable redis

            # Verify Redis is running
            echo "Checking Redis status..."
            redis-cli ping || echo "Redis is not running!"

            # Log in to ECR
            echo "Logging into ECR..."
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin ${REGISTRY}

            # Clean up previous containers & images
            echo "Pruning unused Docker resources..."
            sudo docker container prune -f
            sudo docker image prune -a -f
            sudo docker system prune -a -f

            echo "Stopping and removing any existing container named 'api'..."
            sudo docker stop api || true
            sudo docker rm api || true

            # Create the environment file in /home/ec2-user/
            echo "Creating environment file at /home/ec2-user/TESTAPI.env..."
            echo "${{ secrets.DOTENV }}" > /home/ec2-user/TESTAPI.env
            echo "Contents of /home/ec2-user/TESTAPI.env:"
            cat /home/ec2-user/TESTAPI.env

            # Pull the latest Docker image
            echo "Pulling Docker image..."
            sudo docker pull ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

            # Run the API container with Redis connection & Restart policy
            echo "Running container 'api'..."
            sudo docker run -d --name api --restart always --env-file /home/ec2-user/TESTAPI.env -p 3000:3000 ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

            echo "Deployment complete!"
