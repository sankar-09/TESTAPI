name: Deploy to AWS

on:
  push:
    branches:
      - "Prod"

env:
  AWS_REGION: eu-north-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
  SERVER_PUBLIC_IP: ${{ secrets.AWS_PUBLIC_IP }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aws-deploy
        run: |
          echo "Building Docker image..."
          docker build -t aws-deploy .
          echo "Tagging Docker image..."
          docker tag aws-deploy:latest $REGISTRY/$REPOSITORY:latest
          echo "Pushing Docker image..."
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy Docker Image to EC2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: aws-deploy
          IMAGE_TAG: latest
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_PUBLIC_IP }}
          username: ec2-user
          key: ${{ env.PRIVATE_SSH_KEY }}
          script: |
            # Update package lists and install Docker and AWS CLI if not present
            sudo apt update
            sudo apt install docker.io awscli -y

            # Retrieve an authentication token and authenticate Docker to your registry
            aws ecr get-login-password --region eu-north-1 | sudo docker login --username AWS --password-stdin 166799231300.dkr.ecr.eu-north-1.amazonaws.com

            # Stop and remove any existing container (ignore errors if not present)
            sudo docker stop myappcontainer || true
            sudo docker rm myappcontainer || true

            # Pull the latest Docker image and run it
            sudo docker pull $REGISTRY/$REPOSITORY:$IMAGE_TAG
            sudo docker run -d --name myappcontainer -p 3000:3000 $REGISTRY/$REPOSITORY:$IMAGE_TAG
