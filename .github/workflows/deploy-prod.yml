name: Deploy to AWS

on:
  push:
    branches:
      - "Production"
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 03:00 UTC

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
  SERVER_PUBLIC_IP: ${{ secrets.AWS_PUBLIC_IP }}
  DOTENV: ${{ secrets.DOTENV }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to AWS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag & Push Docker Image
        env:
          REGISTRY: 457812001242.dkr.ecr.ap-south-1.amazonaws.com
          REPOSITORY: aws-deploy
        run: |
          echo "Logging into ECR..."
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY

          echo "Building Docker image..."
          docker build -t aws-deploy .

          echo "Tagging Docker image..."
          docker tag aws-deploy:latest $REGISTRY/$REPOSITORY:latest

          echo "Pushing Docker image to ECR..."
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Deploy to EC2 and Run Containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_PUBLIC_IP }}
          username: ec2-user
          key: ${{ env.PRIVATE_SSH_KEY }}
          script: |
            set -e

            REGISTRY="457812001242.dkr.ecr.ap-south-1.amazonaws.com"
            REPOSITORY="aws-deploy"
            IMAGE_TAG="latest"

            echo "Installing dependencies..."
            sudo yum update -y
            sudo yum install -y docker awscli
            sudo systemctl start docker
            sudo systemctl enable docker

            echo "Creating Docker network if it doesn't exist..."
            if ! sudo docker network ls | grep -q app-network; then
              sudo docker network create app-network
            fi

            echo "Running Redis container..."
            if sudo docker container inspect redis-instance >/dev/null 2>&1; then
              echo "Redis already exists. Restarting..."
              sudo docker restart redis-instance
            else
              sudo docker run -d --name redis-instance --network app-network --restart always -p 6379:6379 redis:alpine
            fi

            echo "Cleaning up old API containers or anything bound to port 3000..."
            sudo docker ps --filter "publish=3000" -q | xargs -r sudo docker rm -f || true
            sudo docker stop api || true
            sudo docker rm api || true

            echo "Creating .env file..."
            echo "${{ secrets.DOTENV }}" | sudo tee /home/ec2-user/TESTAPI.env > /dev/null

            echo "Configuring AWS CLI..."
            aws configure set aws_access_key_id ${{ env.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ env.AWS_SECRET_ACCESS_KEY }}
            aws configure set region ${{ env.AWS_REGION }}

            echo "Pulling latest image from ECR..."
            aws ecr get-login-password | sudo docker login --username AWS --password-stdin $REGISTRY
            sudo docker pull $REGISTRY/$REPOSITORY:$IMAGE_TAG

            echo "Starting API container..."
            sudo docker run -d --restart always --name api \
              --network app-network \
              --env-file /home/ec2-user/TESTAPI.env \
              -p 3000:3000 \
              $REGISTRY/$REPOSITORY:$IMAGE_TAG

            echo "✅ Deployment complete!"